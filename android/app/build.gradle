apply plugin: 'com.android.application'

// Firma fija del proyecto (keystore/ en la raíz, fuera de git). Se define fuera de android {} porque también la
// usa la comprobación de abajo (AUD-ARQ-106).
// `-PhablaKeystoreProps=<ruta>` solo sirve para probar la comprobación sin tocar keystore/.
def keystorePropsFile = rootProject.file(project.findProperty('hablaKeystoreProps') ?: '../keystore/keystore.properties')

android {
    namespace = "com.shift.habla"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.shift.habla"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Versión única para la app y el APK: ../../version.json (también la lee la pantalla Acerca de).
        def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../version.json'))
        versionCode appVersion.build as int
        versionName appVersion.version as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Firma fija del proyecto (keystore/ en la raíz, fuera de git). Si la firma cambia,
    // Android no deja actualizar encima y habría que desinstalar (perdiendo los datos).
    signingConfigs {
        habla {
            if (keystorePropsFile.exists()) {
                def props = new Properties()
                keystorePropsFile.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        // v5.8.2 (AUD-SEG-504): la depuración es OTRA app ("com.shift.habla.debug", «Habla debug» en el
        // lanzador), firmada con la clave de depuración genérica de Android. No puede instalarse encima de la
        // app de uso diario ni leer sus datos, y su WebView sí se puede inspeccionar (CDP) para las pruebas.
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            // El nombre «Habla debug» sale de src/debug/res/values/strings.xml.
        }
        // v5.8.2 (AUD-SEG-001): el APK que se reparte es el release: NO depurable (sin run-as ni CDP: Capacitor
        // solo activa la depuración del WebView en builds depurables), con R8 y firmado con habla.jks, el mismo
        // certificado que las versiones anteriores, así que se instala encima conservando los datos.
        release {
            debuggable false
            signingConfig signingConfigs.habla
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// AUD-ARQ-106: sin keystore/keystore.properties, el release NO se compila (antes salía firmado con la clave
// genérica y con el nombre de siempre: no se instala encima y empuja a desinstalar, perdiendo los datos).
// Solo se comprueba al firmar o empaquetar el release: compilar el Java o el debug sigue funcionando.
tasks.configureEach { task ->
    if (task.name in ['packageRelease', 'validateSigningRelease', 'assembleRelease', 'bundleRelease', 'signReleaseBundle']) {
        task.doFirst {
            if (!keystorePropsFile.exists()) {
                throw new GradleException("Falta keystore/keystore.properties: el APK de Habla debe firmarse con habla.jks. " +
                    "No uses otra clave: los usuarios tendrían que desinstalar y perderían sus datos.")
            }
        }
    }
}

// Nombre del APK: Habla-v<versión>.apk (release) o Habla-v<versión>-debug.apk (debug, otra app), y una copia en
// <proyecto>/apk/ para encontrarlo fácil. Así compilar el debug ya no pisa el APK que se reparte.
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "Habla-v${variant.versionName}.apk"
    }
    variant.assembleProvider.configure { assembleTask ->
        assembleTask.doLast {
            copy {
                from variant.outputs.first().outputFile
                into rootProject.file('../apk')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
